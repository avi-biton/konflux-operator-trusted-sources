---
# Required tasks for the Konflux operator's default pipeline (docker-build-oci-ta-min).
# https://conforma.dev/docs/policy/packages/release_tasks.html
pipeline-required-tasks:
  docker:
    - effective_on: "2025-04-01T00:00:00Z"
      tasks:
        - [buildah, buildah-remote, buildah-oci-ta, buildah-remote-oci-ta, buildah-oci-ta-min]
        - tpa-scan
        - [clamav-scan, clamav-scan-min]
        - deprecated-image-check
        - [git-clone, git-clone-oci-ta, git-clone-oci-ta-min]
        - init
        - [prefetch-dependencies, prefetch-dependencies-oci-ta, prefetch-dependencies-oci-ta-min]
        - rpms-signature-scan
        - [sast-shell-check, sast-shell-check-oci-ta, sast-shell-check-oci-ta-min]
        - [sast-unicode-check, sast-unicode-check-oci-ta, sast-unicode-check-oci-ta-min]
